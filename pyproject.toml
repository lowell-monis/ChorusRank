[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chorusrank"
version = "0.1.0"
description = "Platform-agnostic coordinated inauthentic network detection via similarity search and temporal graph mining"
requires-python = ">=3.10"
dependencies = [
    "atproto>=0.0.46",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "pydantic>=2.6",
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pymongo>=4.6",
    "motor>=3.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "certifi>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
