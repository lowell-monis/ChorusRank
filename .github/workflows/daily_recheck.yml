name: Daily Longitudinal Recheck

on:
  schedule:
    # Runs daily at 12:15 UTC (8:15 AM EDT) - offset from :00 to avoid GitHub Actions runner queue congestion
    - cron: '15 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: read

jobs:
  longitudinal-recheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Longitudinal Status Recheck
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME || 'ChorusRank' }}
          STORAGE_BACKEND: mongodb
        run: |
          uv run python scripts/run_longitudinal_check.py
